    <script>
      (function() {
        try {
          if ('scrollRestoration' in window.history) {
            window.history.scrollRestoration = 'manual';
          }
          if (!window.location.hash || window.location.hash === '#top') {
            window.scrollTo(0, 0);
          }
        } catch (e) {}
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          function HmrDummySocket() {
            var target = document.createDocumentFragment();
            this.addEventListener = target.addEventListener.bind(target);
            this.removeEventListener = target.removeEventListener.bind(target);
            this.dispatchEvent = target.dispatchEvent.bind(target);
            this.readyState = 1;
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            var self = this;
            setTimeout(function() {
              var ev = new Event('open');
              self.dispatchEvent(ev);
              if (typeof self.onopen === 'function') self.onopen(ev);
            }, 0);
          }
          HmrDummySocket.prototype.send = function() {};
          HmrDummySocket.prototype.close = function() {
            this.readyState = 3;
            var ev = new Event('close');
            this.dispatchEvent(ev);
            if (typeof self.onclose === 'function') self.onclose(ev);
          };
          HmrDummySocket.OPEN = 1;
          HmrDummySocket.CONNECTING = 0;
          HmrDummySocket.CLOSING = 2;
          HmrDummySocket.CLOSED = 3;

          window.WebSocket = function(url, protocols) {
            var isViteHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              return new HmrDummySocket();
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && (
            (typeof event.reason.message === 'string' && event.reason.message.indexOf('WebSocket') !== -1) ||
            (typeof event.reason.stack === 'string' && event.reason.stack.indexOf('@vite/client') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (event && event.message && typeof event.message === 'string' && event.message.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
